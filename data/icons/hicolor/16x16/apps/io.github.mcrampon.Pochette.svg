<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- The sleeve alone, drawn on whole pixels for this size: the record would be a smudge. -->
  <defs>
    <linearGradient id="sleeve" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#e0303a"/>
    </linearGradient>
  </defs>
  <rect x="1" y="2" width="14" height="13" rx="1.5" fill="#a51d2d"/>
  <rect x="1" y="1" width="14" height="13" rx="1.5" fill="url(#sleeve)"/>
  <circle cx="8" cy="6" r="3" fill="#ffffff" fill-opacity="0.9"/>
  <g fill="#ffffff" fill-opacity="0.5">
    <rect x="4" y="10" width="8" height="1"/>
    <rect x="6" y="12" width="4" height="1"/>
  </g>
</svg>

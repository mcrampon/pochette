<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- The scalable icon, drawn on whole pixels for this size, with less art. -->
  <defs>
    <linearGradient id="sleeve" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#e0303a"/>
    </linearGradient>
    <mask id="shape" maskUnits="userSpaceOnUse" x="0" y="0" width="16" height="16">
      <rect x="1" y="1" width="14" height="14" rx="2.5" fill="#ffffff"/>
    </mask>
  </defs>
  <g mask="url(#shape)">
    <rect x="1" y="1" width="14" height="14" fill="url(#sleeve)"/>
    <circle cx="5.5" cy="5.5" r="2.5" fill="#ffffff" fill-opacity="0.9"/>
    <g fill="#ffffff" fill-opacity="0.5">
      <rect x="2" y="9" width="6" height="1"/>
      <rect x="2" y="11" width="4" height="1"/>
    </g>
    <circle cx="12.5" cy="12.5" r="5.3" fill="#000000" fill-opacity="0.18"/>
    <circle cx="12.5" cy="12.5" r="4.5" fill="#1c1c1f"/>
    <circle cx="12.5" cy="12.5" r="1.5" fill="#f6d32d"/>
  </g>
</svg>

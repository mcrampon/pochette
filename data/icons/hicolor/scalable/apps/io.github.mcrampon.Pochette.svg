<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="sleeve" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#e0303a"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.75" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- The icon's shape, a rounded square, cut once around all of it: cut shape by shape,
         the edges of those under would show along the corner. -->
    <mask id="shape" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
      <rect x="8" y="8" width="112" height="112" rx="13" fill="#ffffff"/>
    </mask>
  </defs>

  <!-- On a 112 × 112 square, as the Android icon draws it too. -->
  <g mask="url(#shape)">
    <g transform="translate(8 8)">
      <!-- The sleeve, filling the square. -->
      <rect width="112" height="112" fill="url(#sleeve)"/>
      <!-- Its art: a sun setting over lines. -->
      <circle cx="36" cy="36" r="18" fill="#ffffff" fill-opacity="0.85"/>
      <g fill="#ffffff" fill-opacity="0.35">
        <rect x="10" y="64" width="52" height="4" rx="2"/>
        <rect x="10" y="73" width="38" height="4" rx="2"/>
        <rect x="10" y="82" width="24" height="4" rx="2"/>
      </g>
      <!-- The record, over the sleeve's corner, past its edges. -->
      <g transform="translate(91 91)">
        <circle r="36.25" fill="#000000" fill-opacity="0.18"/>
        <circle r="33.25" fill="#1c1c1f"/>
        <circle r="33.25" fill="url(#shine)"/>
        <g fill="none" stroke="#38383d" stroke-width="1">
          <circle r="28.5"/>
          <circle r="24"/>
          <circle r="19.5"/>
          <circle r="15"/>
        </g>
        <circle r="11" fill="#f6d32d"/>
        <circle r="2.5" fill="#1c1c1f"/>
      </g>
    </g>
  </g>
</svg>

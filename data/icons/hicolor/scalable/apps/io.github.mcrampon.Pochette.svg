<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="sleeve" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#e0303a"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.75" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- The record, sliding out of its sleeve. -->
  <g transform="translate(82 66)">
    <circle r="42" fill="#1c1c1f"/>
    <circle r="42" fill="url(#shine)"/>
    <g fill="none" stroke="#38383d" stroke-width="1">
      <circle r="37"/>
      <circle r="32"/>
      <circle r="27"/>
      <circle r="22"/>
    </g>
    <circle r="14" fill="#f6d32d"/>
    <circle r="2.5" fill="#1c1c1f"/>
  </g>

  <!-- The sleeve: its edge, then its face. -->
  <rect x="10" y="24" width="84" height="88" rx="5" fill="#a51d2d"/>
  <rect x="10" y="20" width="84" height="88" rx="5" fill="url(#sleeve)"/>
  <!-- The sleeve's art: a sun setting over lines. -->
  <circle cx="52" cy="56" r="17" fill="#ffffff" fill-opacity="0.85"/>
  <g fill="#ffffff" fill-opacity="0.35">
    <rect x="22" y="78" width="60" height="4" rx="2"/>
    <rect x="30" y="87" width="44" height="4" rx="2"/>
    <rect x="38" y="96" width="28" height="4" rx="2"/>
  </g>
</svg>

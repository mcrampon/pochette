<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- The sleeve alone, drawn on whole pixels for this size: the record would be a smudge. -->
  <defs>
    <linearGradient id="sleeve" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#e0303a"/>
    </linearGradient>
  </defs>
  <rect x="2" y="3" width="20" height="19" rx="1.5" fill="#a51d2d"/>
  <rect x="2" y="2" width="20" height="19" rx="1.5" fill="url(#sleeve)"/>
  <circle cx="12" cy="9" r="4.5" fill="#ffffff" fill-opacity="0.9"/>
  <g fill="#ffffff" fill-opacity="0.5">
    <rect x="6" y="15" width="12" height="1"/>
    <rect x="8" y="17" width="8" height="1"/>
    <rect x="10" y="19" width="4" height="1"/>
  </g>
</svg>

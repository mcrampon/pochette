[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/albuz/albuz"

[workspace.dependencies]
qobuz = { path = "crates/qobuz" }
oo7 = "0.7"
# Plain GTK, no libadwaita: 4.14 is what current distributions ship.
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
# Default features only: the gnome_4x ones also pull in libadwaita.
relm4 = "0.11"
regex = "1"
reqwest = { version = "0.13", features = ["json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "io-util", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# The recipe F-Droid builds the app with, for metadata/io.github.mcrampon.pochette.yml in
# https://gitlab.com/fdroid/fdroiddata: kept here to send it and keep it in step. F-Droid finds
# new versions by the android-v tags on its own (UpdateCheckMode), and the store listing in
# fastlane/metadata/android.

Categories:
  - Multimedia
License: GPL-3.0-or-later
SourceCode: https://github.com/mcrampon/pochette
IssueTracker: https://github.com/mcrampon/pochette/issues

AutoName: Pochette

AntiFeatures:
  NonFreeNet:
    en-US: Plays music from Qobuz, a paid streaming service.

RepoType: git
Repo: https://github.com/mcrampon/pochette.git

Builds:
  - versionName: 1.0.0
    versionCode: 10000
    commit: android-v1.0.0
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y build-essential cmake
    output: build/outputs/apk/release/app-release-unsigned.apk
    srclibs:
      - rustup@1.28.2
    prebuild:
      # The Rust the app is released with: see `rustc --version` in the dev shell.
      - $$rustup$$/rustup-init.sh -y --profile minimal --default-toolchain 1.99.1 --target
        aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - $HOME/.cargo/bin/cargo install cargo-ndk --version 4.1.2 --locked
    gradle:
      - yes
    gradleprops:
      - pochette.cargo=/home/vagrant/.cargo/bin/cargo
    ndk: 29.0.14206865

AutoUpdateMode: Version
UpdateCheckMode: Tags ^android-v.*$
CurrentVersion: 1.0.0
CurrentVersionCode: 10000
